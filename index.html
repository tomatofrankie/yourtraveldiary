    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Your Travel Diary",
      "url": "https://your-simple-travel-diary.netlify.app/",
      "description": "A free travel planning app to organise itineraries, track expenses, manage packing lists, and store hotel & flight info. Works offline on iPhone and Android.",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web, iOS, Android",
      "featureList": [
        "Trip itinerary planner",
        "Travel expense tracker with multi-currency support",
        "Packing and shopping list",
        "Hotel, flight and restaurant info storage",
        "Offline support",
        "Share trips with travel companions",
        "AI travel assistant"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "120"
      }
    }
    </script>

    <!-- JSON-LD: FAQ for AI Overviews -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Your Travel Diary free to use?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, Your Travel Diary is completely free with no subscription required." }
        },
        {
          "@type": "Question",
          "name": "Does the travel diary app work offline?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, the app works offline and syncs automatically when you reconnect." }
        },
        {
          "@type": "Question",
          "name": "Can I share my trip itinerary with others?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, you can share trips with travel companions using an invite code. They get full access to view and edit the trip." }
        },
        {
          "@type": "Question",
          "name": "What currencies does the expense tracker support?",
          "acceptedAnswer": { "@type": "Answer", "text": "The expense tracker supports HKD, USD, EUR, GBP, JPY, CNY, AUD, CAD, CHF, SGD, TWD, KRW, THB and more, with automatic currency conversion." }
        },
        {
          "@type": "Question",
          "name": "Can I use Your Travel Diary on iPhone?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, the app is fully optimised for iPhone and can be added to your home screen for a native app experience." }
        }
      ]
    }
    </script>
